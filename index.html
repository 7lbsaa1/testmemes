<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lbsaa7 | أكبر منصة لتمبلتس الميمز</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: radial-gradient(circle at center, #0e1630 0%, #050814 100%); color: #fff; min-height: 100vh; padding-bottom: 50px; }
        
        /* الهيدر واللوجو */
        header { padding: 30px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
        .logo-area { font-size: 45px; font-weight: 800; color: #fff; direction: ltr; margin-bottom: 10px; display: inline-block; }
        .logo-area span { color: #2563eb; }
        
        /* زرار الرفع الفخم */
        .upload-trigger { padding: 14px 30px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4); transition: all 0.3s; }
        .upload-trigger:hover { transform: translateY(-3px); box-shadow: 0 6px 25px rgba(37, 99, 235, 0.6); }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h2 { font-size: 20px; margin: 25px 0 15px 0; color: #2563eb; border-right: 4px solid #2563eb; padding-right: 10px; }

        /* شبكة عرض الصور */
        .memes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .meme-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 16px; text-align: center; backdrop-filter: blur(5px); transition: all 0.3s; }
        .meme-card:hover { transform: translateY(-5px); border-color: rgba(37, 99, 235, 0.4); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .meme-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 10px; background: #000; }
        .meme-card h4 { font-size: 14px; margin-top: 10px; color: #a5a1ca; font-weight: 500; }

        /* نافذة الرفع المنبثقة Glassmorphism */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .modal-content { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.1); padding: 35px 25px; border-radius: 24px; width: 90%; max-width: 420px; text-align: center; }
        .modal-content input[type="text"] { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.4); color: #fff; text-align: right; outline: none; }
        .modal-content input[type="text"]:focus { border-color: #2563eb; }
        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-submit { flex: 1; padding: 13px; background: #22c55e; color: #000; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn-cancel { flex: 1; padding: 13px; background: #ff3366; color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">lbsaa<span>7</span></div>
        <p style="color: #a5a1ca; margin-bottom: 20px; font-size: 14px;">مكتبة التمبلتس المفتوحة للمبدعين</p>
        <button class="upload-trigger" onclick="openUploadModal()"><i class="fas fa-plus-circle"></i> شارك تمبلت من عندك</button>
    </header>

    <div class="container">
        <h2>🔥 تمبلتس جديدة من اختيار الأعضاء</h2>
        <div class="memes-grid" id="firebase-approved-grid">
            </div>

        <h2>قائمة التمبلتس الأساسية (${90} صورة)</h2>
        <div class="memes-grid" id="local-memes-grid">
            </div>
    </div>

    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px; color: #fff;">إرسال تمبلت للمراجعة</h3>
            <input type="text" id="meme-title" placeholder="اكتب اسم التمبلت الميم (مثال: ميم حمدي الميرغني)">
            <input type="file" id="meme-file" accept="image/*" style="width: 100%; color: #fff; margin-bottom: 20px; font-size: 13px;">
            <div class="modal-btns">
                <button class="btn-submit" onclick="submitTemplate()">إرسال للأدمن</button>
                <button class="btn-cancel" onclick="closeUploadModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { databaseURL: "https://admin-37e09-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 1. توليد الـ 90 صورة المحلية تلقائياً بالمسار المظبوط بتاعك
        let localGrid = document.getElementById('local-memes-grid');
        for (let i = 1; i <= 90; i++) {
            localGrid.innerHTML += `
                <div class="meme-card">
                    <img src="meme${i}.jpg" alt="تمبلت ${i}">
                    <h4>تمبلت ميم رقم ${i}</h4>
                </div>
            `;
        }

        // 2. التحكم في فتح وقفل نافذة الرفع
        function openUploadModal() { document.getElementById('uploadModal').style.display = 'flex'; }
        function closeUploadModal() { document.getElementById('uploadModal').style.display = 'none'; }

        // 3. رفع صورة جديدة كـ Base64 لفرع الانتظار
        function submitTemplate() {
            let title = document.getElementById('meme-title').value.trim();
            let fileInput = document.getElementById('meme-file');
            if(!title || fileInput.files.length === 0) return alert('برجاء كتابة الاسم واختيار التمبلت أولاً!');

            let reader = new FileReader();
            reader.readAsDataURL(fileInput.files[0]);
            reader.onload = function() {
                database.ref('pending_templates').push({
                    title: title,
                    image: reader.result,
                    timestamp: new Date().getTime()
                }).then(() => {
                    alert('وصلت للأدمن بنجاح! هتتنشر في الموقع فوراً أول ما يوافق عليها 🚀');
                    closeUploadModal();
                    document.getElementById('meme-title').value = '';
                    fileInput.value = '';
                });
            }
        }

        // 4. جلب وعرض الصور المعتمدة لايف من الفايربيز
        database.ref('approved_templates').on('value', (snapshot) => {
            let fireGrid = document.getElementById('firebase-approved-grid');
            fireGrid.innerHTML = '';
            if(snapshot.exists()) {
                snapshot.forEach(child => {
                    let data = child.val();
                    fireGrid.innerHTML += `
                        <div class="meme-card" style="border-color: rgba(34, 197, 94, 0.2);">
                            <img src="${data.image}">
                            <h4 style="color: #22c55e;">${data.title} ✨</h4>
                        </div>
                    `;
                });
            } else {
                fireGrid.innerHTML = '<p style="color: #555; font-weight: 500; grid-column: 1/-1; text-align: center; padding: 10px;">لا توجد تمبلتس مرفوعة من الأعضاء حالياً، شارك أول تمبلت!</p>';
            }
        });
    </script>
</body>
</html>
